<button (click)="toggleTheme()" [ngClass]="{
      'bg-yellow-600': isDarkMode, 
      'bg-blue-500': !isDarkMode,
      'text-white': isDarkMode, 
      'text-gray-800': !isDarkMode
    }"
  class="px-3 py-2 rounded-full hover:bg-opacity-80 focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-300">
  <i class="fas" [ngClass]="{'fa-sun': isDarkMode, 'fa-moon': !isDarkMode}"></i>
</button>

<section class="mx-auto max-w-4xl py-10">
  <div class="container mx-auto px-6">
    <h2 class="text-3xl font-bold text-center mb-6">Sobre Mim</h2>
    <div class="flex flex-col md:flex-row items-center justify-between space-y-8 md:space-y-0 md:space-x-2 ">
      <div class="md:w-1/2">
        <app-sobre-min-imagem />
      </div>
      <div class="md:w-1/2">
        <app-sobre-min-conteudo [modoHome]="modoHome" />
      </div>
    </div>
    @if(modoHome==false){
    <app-sobre-min-video-apresentacao />
    }
  </div>
  <!-- Botão de mais sobre min -->
  @if(modoHome==true){
  <div class="mt-3 text-center">
    <app-botao-mais-sobre-min />
  </div>
  }
</section>

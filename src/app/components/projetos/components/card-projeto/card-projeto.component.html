<div
  class="bg-white shadow-md rounded-lg overflow-hidden transition-all duration-300 transform hover:scale-105"
>
  <!-- Imagem do Projeto -->
  <img
    [src]="projeto?.imagem"
    [alt]="projeto?.titulo"
    class="w-full h-40 object-cover"
  />
  <div class="p-4">
    <!-- Título do Projeto -->
    <h3 class="text-xl font-semibold mb-2">{{ projeto?.titulo }}</h3>
    <!-- Descrição do Projeto -->
    <p class="text-gray-600 text-sm">{{ projeto?.descricao }}</p>
    <!-- Pills de Tecnologias -->
    <div class="mt-3 flex flex-wrap gap-2">
      <span
        *ngFor="let tecnologia of projeto?.tecnologias"
        class="bg-blue-100 text-blue-600 text-xs font-medium px-3 py-1 rounded-full"
      >
        {{ tecnologia }}
      </span>
    </div>
  </div>
</div>

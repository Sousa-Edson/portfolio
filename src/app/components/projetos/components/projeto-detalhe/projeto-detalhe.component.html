<div *ngIf="projeto" class="mx-auto mt-10 max-w-4xl p-6">
  <!-- Título do Projeto -->
  <h2 class="text-3xl font-bold">{{ projeto.titulo }}</h2>

  <!-- Descrição Resumida -->
  <p class="text-gray-600 dark:text-gray-200 font-semibold bg-yellow-500 dark:bg-blue-500 mb-4 p-2 rounded">
    {{ projeto.descricaoResumida }}
  </p>

  <!-- Imagem Principal -->
  <img [src]="projeto.imagemPrincipal" [alt]="projeto.titulo"
    class="w-full h-80 object-cover my-4 rounded-lg cursor-pointer" (click)="abrirModal(projeto.imagemPrincipal)" />

  <!-- Descrição Completa -->
  <div class="text-gray-600 space-y-4">
    <p class="text-gray-600" *ngFor="let paragrafo of projeto.descricaoCompleta">
      {{ paragrafo }}
    </p>
  </div>

  @if(projeto.link){
  <div
    class="flex mt-2 p-4 ring-1 ring-yellow-600   dark:ring-blue-600 justify-center rounded font-bold dark:text-blue-600  dark:hover:text-blue-400 text-yellow-600  hover:text-yellow-400 transition-all duration-300 ease-in-out">
    <a [href]="projeto.link" target="_blank" rel="noopener noreferrer">Link para
      codigo</a>
  </div>
  }

  <!-- Lista de Imagens -->
  @if(projeto.imagemLista && projeto.imagemLista.length > 0){
  <div class="mt-6">
    <h3 class="text-2xl font-semibold mb-3">Imagens</h3>
    <div class="flex gap-4 overflow-x-auto ">
      <img *ngFor="let imagem of projeto.imagemLista" [src]="imagem" [alt]="'Imagem do Projeto'"
        (click)="abrirModal(imagem)"
        class="w-32 h-32 object-cover rounded-lg shadow-md cursor-pointer  border-0 hover:border-4 hover:border-blue-400  " />
    </div>
  </div>
  }

  @if(videoSeguro){ <div class="container mx-auto px-6 mt-6">
    <h2 class="text-3xl font-bold text-center mb-6">Vídeo de Apresentação
    </h2>
    <div class="flex justify-center">
      <!-- Embedding YouTube Video -->
      <div class="w-full">
        <iframe class="w-full h-64 md:h-96 rounded-lg shadow-lg" [src]="videoSeguro" title="Vídeo de Apresentação"
          frameborder="0" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen></iframe>
      </div>
    </div>
  </div>
  }

  <!-- Lista de Vídeos -->
  <div *ngIf="videoSeguroLista.length > 0" class="mt-6">
    <h3 class="text-2xl font-semibold mb-3">Vídeos</h3>
    <div class="flex gap-4 overflow-x-auto">
      <iframe *ngFor="let videoSeguro of videoSeguroLista" [src]="videoSeguro" frameborder="0"
        allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen
        class="w-48 h-28 rounded-lg shadow-md"></iframe>
    </div>
  </div>
  <!-- Tecnologias -->
  <div class="mt-4">
    <span *ngFor="let tecnologia of projeto.tecnologias"
      class="bg-blue-100 text-blue-600 text-xs font-medium px-3 py-1 rounded-full mr-2">
      {{ tecnologia }}
    </span>
  </div>
  <div class="mt-10 text-center">
    <app-botao-mais-projetos />
  </div>

  <!-- Modal -->
  <app-imagem-modal [imagemAtual]="imagemAtual" [modalAberto]="modalAberto" (modalFecha)="fecharModal()" />

<section class="mx-auto mt-10 max-w-4xl px-2 md:px-0">
  <h2 class="text-3xl font-semibold text-center mb-6">Meus Projetos</h2>
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 group">
    <!-- Card do Projeto -->
    <div *ngFor="let projeto of projetos">
      <app-card-projeto
        class="relative transition-transform duration-300 group-hover:opacity-100 hover:opacity-100 hover:scale-105"
        [projeto]="projeto"></app-card-projeto>
    </div>
  </div>


  <!-- Botão de Mais Projetos -->
  @if(modoHome==true){
  <div class="mt-10 text-center">
    <app-botao-mais-projetos></app-botao-mais-projetos>
  </div>
  }
</section>

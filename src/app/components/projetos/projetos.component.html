<section class="mx-auto mt-10 max-w-6xl px-2 md:px-0">
  <h2 class="text-3xl font-semibold text-center mb-6">Meus Projetos</h2>
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <!-- Card do Projeto -->
    @for (projeto of projetos; track $index) {
    <app-card-projeto [projeto]="projeto" />
    }
  </div>

  <!-- Botão de Mais Projetos -->
  <div class="mt-10 text-center">
    <app-botao-mais-projetos />
  </div>
</section>
